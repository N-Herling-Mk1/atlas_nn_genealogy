<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Version history of the MSVtx ABCD NN1/NN2 input features (barrel / endcap) - browse and download as .txt, .csv or .py.">

<meta property="og:image" content="https://n-herling-mk1.github.io/atlas_nn_genealogy/assets/social_card.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --ink:#e9eef2; --mute:#7d8a96; --line:#2a333c; --spine:#4a5661;
  --ares:#e8230a; --cyan:#6fe3ef;
  --blue:#4da3ff; --green:#3ddc84; --yellow:#ffd23f;   /* highlights: NN1 / NN2 / NEW + names */
  --mono:'Share Tech Mono',ui-monospace,Consolas,monospace; --head:'Orbitron',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;gap:22px;padding:22px 28px}
.top img{width:120px;height:120px;flex:none;display:block}
.top h1{font-family:var(--head);font-weight:900;font-size:clamp(20px,3.6vw,34px);letter-spacing:.06em;margin:0;line-height:1.05}
.top h1 b{color:var(--ares);font-weight:900}
.top .sub{color:var(--mute);margin-top:8px;letter-spacing:.06em;font-size:13px}
.top a{text-decoration:none}

/* ---------- page 1: timeline ---------- */
.tl{position:relative;max-width:980px;margin:10px auto 0;padding:40px 16px 60px}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;
  background:linear-gradient(transparent,var(--blue) 40px,var(--green) 50%,var(--ares) calc(100% - 40px),transparent);opacity:.75}
.ev{position:relative;display:flex;min-height:150px;margin-bottom:36px}
/* desktop: JS stacks entries so left/right interleave (see layout()) */
.tl.packed .ev{position:absolute;left:16px;right:16px;margin:0;min-height:0}
.ev .arm{position:absolute;top:34px;height:3px;background:var(--spine)}
.ev .knot{position:absolute;left:50%;top:27px;width:17px;height:17px;margin-left:-8.5px;background:#000;border:3px solid var(--ink);transform:rotate(45deg)}
.ev.l{justify-content:flex-start} .ev.r{justify-content:flex-end}
.ev.l .arm{left:40%;right:50%} .ev.r .arm{left:50%;right:40%}
.entry{width:40%;text-align:left;background:none;border:0;padding:0;cursor:pointer;line-height:1.55}
.ev.l .entry{padding-right:18px} .ev.r .entry{padding-left:18px}
.entry .d{font-family:var(--head);font-weight:900;font-size:17px;letter-spacing:.08em;color:var(--ares)}
.entry .row{font-size:15px;letter-spacing:.04em}
.entry .row.n1{color:var(--blue)} .entry .row.n2{color:var(--green)}
.entry .row span{color:var(--ink)}
.entry .nm{color:var(--yellow)}
.entry .id{font-family:var(--head);font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--mute);margin-top:4px}
.entry:hover .d,.entry:focus-visible .d{color:#fff;text-shadow:0 0 12px var(--ares)}
.ev:has(.entry:hover) .knot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 14px var(--yellow)}
.ev.last .knot{background:var(--ares);border-color:var(--ares)}
.ev:has(.entry:hover) .arm{background:var(--yellow)}
.notes{margin-top:10px;border-left:2px solid var(--line);padding:4px 0 4px 12px}
.notes .k{font-family:var(--head);font-weight:700;font-size:10px;letter-spacing:.2em;color:var(--yellow);margin-bottom:4px}
.notes ul{margin:0;padding:0 0 0 14px;color:var(--mute);font-size:12.5px;line-height:1.5}
.notes li{display:list-item;border:0;padding:1px 0;word-break:normal;grid-template-columns:none}
.notes.na ul{list-style:none;padding:0}
.pg .notes{margin:22px 0 4px;max-width:760px}
.pg .notes ul{font-size:13.5px;color:#b9c3cc}
.key{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.08em;margin:0 0 70px}

/* ---------- page 2: features ---------- */
.pg{max-width:980px;margin:0 auto;padding:6px 16px 80px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.nav button{background:none;border:0;cursor:pointer;letter-spacing:.12em;font-family:var(--head);font-weight:700;font-size:12px;padding:4px 0}
.nav button:hover{color:var(--yellow)}
.nav button[disabled]{color:var(--line);cursor:default}
.vh{margin:30px 0 8px}
.vh .d{font-family:var(--head);font-weight:900;font-size:clamp(22px,4vw,30px);letter-spacing:.06em;color:var(--ares)}
.vh .nm{color:var(--yellow);margin-top:6px;letter-spacing:.06em}
.dl{display:flex;gap:10px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.dl .k{color:var(--mute);font-size:12px;letter-spacing:.14em;margin-right:4px}
.dl button{background:none;border:1px solid var(--spine);padding:6px 14px;cursor:pointer;letter-spacing:.06em}
.dl button:hover{border-color:var(--yellow);color:var(--yellow)}
section.net{margin-top:34px}
section.net h2{font-family:var(--head);font-weight:900;font-size:20px;letter-spacing:.12em;margin:0 0 12px;border-bottom:2px solid currentColor;padding-bottom:8px}
section.NN1 h2{color:var(--blue)} section.NN2 h2{color:var(--green)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
.cols h3{font-family:var(--head);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--mute);margin:0 0 8px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:30px 1fr;padding:5px 0;border-bottom:1px solid var(--line);word-break:break-all}
li .n{color:var(--mute)}
li.new .f{color:var(--yellow)}
li.new .f:after{content:"  NEW";font-size:10px;letter-spacing:.14em}
li.gone{color:var(--mute);text-decoration:line-through}
.note{color:var(--mute);font-size:12px;margin-top:26px;letter-spacing:.04em}

@media (max-width:700px){
  .top{padding:16px}
  .top img{width:84px;height:84px}
  .tl:before{left:26px}
  .ev,.ev.l,.ev.r{justify-content:flex-start;min-height:0;padding-bottom:36px}
  .ev .knot{left:10px;margin-left:-7px}
  .ev.l .arm,.ev.r .arm{left:12px;right:auto;width:30px}
  .entry,.ev.l .entry,.ev.r .entry{width:auto;margin-left:54px;padding:0}
  .ev{margin-bottom:8px}
  .key{text-align:left;padding:0 16px 0 70px}
  .cols{grid-template-columns:1fr}
  .cols>div+div{margin-top:20px}
}
</style>
</head>
<body>
<header class="top">
  <a href="#" aria-label="Timeline"><img src="assets/badge_512.jpg" alt="UA ATLAS badge" width="120" height="120"></a>
  <div>
    <h1><a href="#">NN FEATURE <b>GENEALOGY</b></a></h1>
    <div class="sub">MSVtx &middot; NN1 / NN2 input features</div>
  </div>
</header>
<main id="app"></main>

<script src="data.js"></script>
<script>
(function(){
const D=window.NN_GENEALOGY, app=document.getElementById('app');
if(!D){app.innerHTML='<p class="pg">data.js missing — run python tools/build.py</p>';return;}
const V=D.versions, NETS=['NN1','NN2'], REG=['barrel','endcap'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const conf=(v,net,reg)=>v.features.filter(f=>f.status==='confirmed'&&f.net===net&&f.region===reg).sort((a,b)=>a.position-b.position);
const idx=id=>V.findIndex(v=>v.id===id);

function notes(v){
  const n=(v.notes&&v.notes.length)?v.notes:['NA'], na=n.length===1&&n[0]==='NA';
  return `<div class="notes${na?' na':''}"><div class="k">NOTES</div><ul>${n.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function timeline(){
  let h='<div class="tl">';
  V.forEach((v,i)=>{
    const side=i%2?'r':'l', n=(net,reg)=>conf(v,net,reg).length;
    h+=`<div class="ev ${side}${i===V.length-1?' last':''}"><div class="arm"></div><div class="knot"></div>
      <button class="entry" data-id="${v.id}" aria-label="Open ${esc(v.id)}">
        <div class="d">${esc(v.date_display||v.date)}</div>
        <div class="row n1">NN1 &nbsp;<span>${n('NN1','barrel')} &middot; ${n('NN1','endcap')}</span></div>
        <div class="row n2">NN2 &nbsp;<span>${n('NN2','barrel')} &middot; ${n('NN2','endcap')}</span></div>
        <div class="nm">${esc(v.name||'')}</div>
        <div class="id">${esc(v.id.toUpperCase())}</div>
        ${notes(v)}
      </button></div>`;
  });
  h+='</div><p class="key">feature counts: barrel &middot; endcap &nbsp;&mdash;&nbsp; select a version</p>';
  app.innerHTML=h;
  app.querySelectorAll('.entry').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});
}

function features(id){
  const i=idx(id), v=V[i], p=V[i-1], nx=V[i+1];
  let h=`<div class="pg"><div class="nav">
    <button data-go="">&larr; TIMELINE</button>
    <span><button data-go="${p?p.id:''}" ${p?'':'disabled'}>&lsaquo; ${p?esc(p.id.toUpperCase()):'—'}</button>
    &nbsp;&nbsp;<button data-go="${nx?nx.id:''}" ${nx?'':'disabled'}>${nx?esc(nx.id.toUpperCase()):'—'} &rsaquo;</button></span></div>
    <div class="vh"><div class="d">${esc(v.id.toUpperCase())} &middot; ${esc(v.date_display||v.date)}</div><div class="nm">${esc(v.name||'')}</div>${notes(v)}</div>
    <div class="dl"><span class="k">DOWNLOAD</span><button data-fmt="txt">.txt</button><button data-fmt="csv">.csv</button><button data-fmt="py">.py</button></div>`;
  for(const net of NETS){
    h+=`<section class="net ${net}"><h2>${net}</h2><div class="cols">`;
    for(const reg of REG){
      const cur=conf(v,net,reg), prev=p?new Set(conf(p,net,reg).map(f=>f.canonical)):null;
      const gone=p?conf(p,net,reg).filter(f=>!cur.some(c=>c.canonical===f.canonical)):[];
      h+=`<div><h3>${reg.toUpperCase()} &middot; ${cur.length}</h3><ol>`;
      cur.forEach(f=>{h+=`<li class="${prev&&!prev.has(f.canonical)?'new':''}"><span class="n">${f.position}</span><span class="f">${esc(f.canonical)}</span></li>`;});
      gone.forEach(f=>{h+=`<li class="gone"><span class="n">&minus;</span><span class="f">${esc(f.canonical)}</span></li>`;});
      h+='</ol></div>';
    }
    h+='</div></section>';
  }
  h+=p?`<p class="note"><span style="color:var(--yellow)">NEW</span> = not in ${esc(p.id)}. Struck-through = dropped since ${esc(p.id)}.</p>`:'';
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go;});
  app.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>download(v,b.dataset.fmt));
}

// ---------- downloads (confirmed features of one version)
function asTxt(v){
  const o=[`# nn features ${v.id} (${v.date}) -- ${v.name||''}`];
  for(const net of NETS)for(const reg of REG){const g=conf(v,net,reg);o.push('',`# ${net} ${reg} (${g.length})`);g.forEach(f=>o.push(f.canonical));}
  return o.join('\n')+'\n';
}
function asCsv(v){
  const q=x=>/[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x, r=['version,net,region,position,feature'];
  for(const net of NETS)for(const reg of REG)conf(v,net,reg).forEach(f=>r.push([v.id,net,reg,f.position,q(f.canonical)].join(',')));
  return r.join('\r\n')+'\r\n';
}
function asPy(v){
  const s=JSON.stringify, o=['# -*- coding: utf-8 -*-',`"""nn features ${v.id} (${v.date}) -- ${v.name||''}`,
    'Entries: "name" or ["canonical", *verified_alternates]  (same as nn_features.py)"""','','NN_FEATURES = {'];
  for(const reg of REG){o.push(`    ${s(reg)}: {`);
    for(const net of NETS){o.push(`        ${s(net)}: [`);
      conf(v,net,reg).forEach(f=>o.push('            '+((f.variants||[]).length?'['+[f.canonical,...f.variants].map(x=>s(x)).join(', ')+']':s(f.canonical))+','));
      o.push('        ],');}
    o.push('    },');}
  o.push('}','','','def features(region, nn):','    """Canonical names for (\'barrel\'|\'endcap\', \'NN1\'|\'NN2\')."""',
    '    return [e if isinstance(e, str) else e[0] for e in NN_FEATURES[region][nn]]','',
    'if __name__ == "__main__":','    for r in NN_FEATURES:','        for n in NN_FEATURES[r]:',
    '            print(f"[{r}] {n}: {len(features(r, n))}")','');
  return o.join('\n');
}
function download(v,fmt){
  const body=fmt==='txt'?asTxt(v):fmt==='py'?asPy(v):asCsv(v);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));
  a.download=`nn_features_${v.id}.${fmt}`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

// interleave left/right entries: each entry starts as high as possible, but
// every knot stays at least GAP below the previous one (chronology preserved)
function layout(){
  const tl=app.querySelector('.tl'); if(!tl) return;
  const evs=[...tl.querySelectorAll('.ev')];
  if(window.innerWidth<=700){tl.classList.remove('packed');tl.style.height='';evs.forEach(e=>e.style.top='');return;}
  tl.classList.add('packed');
  const GAP=110, SAME=40; let knot=40; const bottom={l:0,r:0};
  evs.forEach((e,i)=>{
    const side=e.classList.contains('l')?'l':'r';
    const top=i===0?40:Math.max(knot+GAP, bottom[side]+SAME);
    e.style.top=top+'px'; knot=top; bottom[side]=top+e.offsetHeight;
  });
  tl.style.height=(Math.max(bottom.l,bottom.r)+60)+'px';
}
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);

function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  if(idx(id)>=0){features(id);document.title=`${id.toUpperCase()} · NN Feature Genealogy`;}
  else{timeline();layout();document.title='NN Feature Genealogy';}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
